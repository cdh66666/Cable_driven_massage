<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>USB 轨迹控制台 v1.2.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#edf0f4;color:#111;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
main{max-width:1320px;margin:0 auto;padding:18px;display:grid;grid-template-columns:360px 1fr;gap:18px}
.panel{background:#fff;border:1px solid #d6dbe3;border-radius:8px;padding:16px}
h1{font-size:28px;margin:0 0 14px}
h2{font-size:18px;margin:18px 0 10px}
label{display:block;font-size:14px;margin:10px 0 4px;color:#333}
select,input,button{font:inherit}
select,input[type=file]{width:100%;min-height:36px}
button{width:100%;height:50px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:750;font-size:18px;margin:6px 0;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.manual{background:#155e75}
.manual.fast{background:#7c2d12}
.stop{background:#a7191d}
.secondary{background:#4b5563}
.calib{background:#8a3415}
.muted{color:#555;font-size:13px;line-height:1.45}
.meter{background:#f6f7f9;border:1px solid #e2e5ea;border-radius:8px;padding:12px;margin:8px 0}
.volt{font-size:38px;line-height:1.05;font-weight:800}
.small-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px}
.value{font-weight:700}
.topline{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.topline button{height:38px;font-size:14px;margin:0;width:auto;padding:0 12px}
.slider{display:grid;grid-template-columns:auto 1fr 46px;gap:10px;align-items:center;margin:8px 0}
.slider input{width:100%;accent-color:#111}
.slider span{font-weight:700;text-align:right}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:#333;margin:6px 0}
.legend i{display:inline-block;width:12px;height:3px;margin-right:5px;vertical-align:middle}
#airChart{width:100%;height:128px;background:#fff;border:1px solid #d8dde6;border-radius:8px;display:block}
#pad{width:100%;aspect-ratio:1/1;background:#fff;border:3px solid #111;display:block;touch-action:none}
#log{white-space:pre-wrap;max-height:240px;overflow:auto;font-size:13px;line-height:1.4;background:#f6f7f9;border:1px solid #e2e5ea;border-radius:8px;padding:10px}
@media(max-width:900px){main{grid-template-columns:1fr}.panel.canvas{order:-1}}
</style>
</head>
<body>
<main>
  <section class="panel">
    <h1>USB 轨迹控制台 v1.2.1</h1>

    <div class="topline">
      <select id="ports"></select>
      <button id="refreshPorts" class="secondary">刷新</button>
    </div>
    <p class="muted">上电后选 USB-Enhanced-SERIAL CH343 对应端口，一般是 COM52。关闭 VSCode 串口监视器后再操作。</p>

    <h2>气压监视</h2>
    <div class="meter">
      <div class="volt"><span id="voltage">--</span> V</div>
      <div class="small-grid">
        <div>气压：<span id="pressure" class="value">--</span></div>
        <div>控制：<span id="airOn" class="value">--</span></div>
        <div>模式：<span id="airMode" class="value">--</span></div>
        <div>PWM：<span id="duty" class="value">--</span></div>
        <div>刷新：<span id="sampleRate" class="value">--</span></div>
      </div>
    </div>
    <canvas id="airChart" width="640" height="220"></canvas>
    <div class="legend">
      <div><i style="background:#0f766e"></i>实时/稳定</div>
    </div>

    <h2>手动调气</h2>
    <div class="slider">
      <label for="manualPwm">充气 PWM</label>
      <input id="manualPwm" type="range" min="0" max="255" value="140">
      <span id="manualPwmText">140</span>
    </div>
    <div class="row">
      <button id="manualInflate" class="manual">手动充气</button>
      <button id="manualDeflateSlow" class="manual">慢放气</button>
    </div>
    <div class="row">
      <button id="manualDeflateFast" class="manual fast">快放气</button>
      <button id="manualStop" class="secondary">停止手动</button>
    </div>

    <h2>画图</h2>
    <label>导入轨迹 TXT / JSON</label>
    <input id="file" type="file" accept=".txt,.json,text/plain,application/json">
    <button id="upload">上传轨迹</button>
    <div class="slider">
      <label for="drawSpeed">轨迹速度</label>
      <input id="drawSpeed" type="range" min="1" max="100" value="50">
      <span id="drawSpeedText">50</span>
    </div>
    <div class="slider">
      <label for="motionCurrent">电机电流</label>
      <input id="motionCurrent" type="range" min="300" max="2200" step="50" value="1000">
      <span id="motionCurrentText">1000mA</span>
    </div>
    <div class="row">
      <button id="start">开始绘制</button>
      <button id="stop" class="stop">停止</button>
    </div>
    <button id="clear" class="secondary">清空画板</button>

    <h2>校准</h2>
    <button id="calibrate" class="calib">校准参数</button>
    <button id="readStatus" class="secondary">读取状态</button>

    <h2>状态</h2>
    <div id="log">页面已打开，等待操作。</div>
  </section>

  <section class="panel canvas">
    <canvas id="pad" width="900" height="900"></canvas>
  </section>
</main>

<script>
const L0 = 150;
const pad = document.getElementById('pad');
const ctx = pad.getContext('2d');
const airChart = document.getElementById('airChart');
const airCtx = airChart.getContext('2d');
const ports = document.getElementById('ports');
const logEl = document.getElementById('log');
const voltageEl = document.getElementById('voltage');
const pressureEl = document.getElementById('pressure');
const airOnEl = document.getElementById('airOn');
const airModeEl = document.getElementById('airMode');
const dutyEl = document.getElementById('duty');
const sampleRateEl = document.getElementById('sampleRate');
const drawSpeed = document.getElementById('drawSpeed');
const drawSpeedText = document.getElementById('drawSpeedText');
const motionCurrent = document.getElementById('motionCurrent');
const motionCurrentText = document.getElementById('motionCurrentText');
const manualPwm = document.getElementById('manualPwm');
const manualPwmText = document.getElementById('manualPwmText');
let strokes = [];
let drawing = false;
let activeStroke = null;
let polling = false;
let playbackActive = false;
let uploadActive = false;
let airPollMs = 100;
let airSamples = [];
let lastSampleAt = 0;
let sampleTicks = [];
const maxAirSamples = 900;

function log(text){logEl.textContent = text || '无返回。';}
function appendLog(text){logEl.textContent = `${text}\n${logEl.textContent}`.slice(0,5000);}
function selectedPort(){return ports.value || '';}

async function api(path, body){
  const res = await fetch(path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body || {})
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || '请求失败');
  return data.message || '';
}

async function command(command, prefixes, timeout=4){
  return await api('/api/command', {port:selectedPort(), command, prefixes, timeout});
}

function parseValue(text, key){
  const re = new RegExp('(?:^|\\s)' + key + '=([^\\s]+)');
  const m = text.match(re);
  return m ? m[1].replace(/[A-Za-z]+$/,'') : null;
}

function numValue(text, key){
  const raw = parseValue(text, key);
  if(raw === null) return NaN;
  const n = Number(raw);
  return Number.isFinite(n) ? n : NaN;
}

function updateTelemetry(text){
  const v = numValue(text, 'v') || numValue(text, 'airV');
  const p = numValue(text, 'p') || numValue(text, 'airP');
  const stable = numValue(text, 'stable') || numValue(text, 'airStable');
  const duty = numValue(text, 'duty') || numValue(text, 'airDuty');
  const on = parseValue(text, 'on') || parseValue(text, 'airOn');
  const mode = parseValue(text, 'mode') || parseValue(text, 'airMode');

  if(Number.isFinite(v)) voltageEl.textContent = v.toFixed(3);
  if(Number.isFinite(p) || Number.isFinite(stable)){
    pressureEl.textContent = `${Number.isFinite(p)?p.toFixed(3):'--'} / ${Number.isFinite(stable)?stable.toFixed(3):'--'} kPa`;
  }
  if(Number.isFinite(duty)) dutyEl.textContent = `${duty.toFixed(0)}/255`;
  if(on !== null) airOnEl.textContent = (on === '1' || on === 'true') ? '开' : '关';
  if(mode !== null) airModeEl.textContent = mode;

  const now = performance.now();
  if(Number.isFinite(p) || Number.isFinite(stable)){
    airSamples.push({
      t: now,
      p: Number.isFinite(stable) ? stable : p,
      raw: Number.isFinite(p) ? p : stable
    });
    while(airSamples.length > maxAirSamples) airSamples.shift();
    sampleTicks.push(now);
    while(sampleTicks.length && now - sampleTicks[0] > 1000) sampleTicks.shift();
    sampleRateEl.textContent = `${sampleTicks.length}Hz / 图100Hz`;
    lastSampleAt = now;
  }
}

function drawAirChart(){
  const w = airChart.width;
  const h = airChart.height;
  airCtx.clearRect(0,0,w,h);
  airCtx.fillStyle = '#fff';
  airCtx.fillRect(0,0,w,h);
  airCtx.strokeStyle = '#d7dde7';
  airCtx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const y = 16 + i*(h-32)/4;
    airCtx.beginPath(); airCtx.moveTo(44,y); airCtx.lineTo(w-10,y); airCtx.stroke();
  }
  const recent = airSamples.slice(-300);
  if(recent.length < 2){
    airCtx.fillStyle = '#777';
    airCtx.fillText('等待气压数据...', 52, 36);
    return;
  }
  let vals = [];
  for(const s of recent){
    ['p','raw','min','max','target'].forEach(k => { if(Number.isFinite(s[k])) vals.push(s[k]); });
  }
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(!Number.isFinite(lo) || !Number.isFinite(hi) || hi - lo < 0.2){ lo -= 0.1; hi += 0.1; }
  lo -= 0.08; hi += 0.08;
  const xOf = i => 44 + i*(w-56)/(recent.length-1);
  const yOf = v => h-18 - (v-lo)*(h-34)/(hi-lo);
  const last = recent[recent.length-1];
  if(Number.isFinite(last.min) && Number.isFinite(last.max)){
    airCtx.fillStyle = 'rgba(245,158,11,0.16)';
    const y1 = yOf(last.max), y2 = yOf(last.min);
    airCtx.fillRect(44, Math.min(y1,y2), w-56, Math.abs(y2-y1));
    airCtx.strokeStyle = '#f59e0b';
    airCtx.setLineDash([6,4]);
    for(const v of [last.min,last.max]){
      airCtx.beginPath(); airCtx.moveTo(44,yOf(v)); airCtx.lineTo(w-10,yOf(v)); airCtx.stroke();
    }
    airCtx.setLineDash([]);
  }
  if(Number.isFinite(last.target)){
    airCtx.strokeStyle = '#1d4ed8';
    airCtx.lineWidth = 2;
    airCtx.beginPath(); airCtx.moveTo(44,yOf(last.target)); airCtx.lineTo(w-10,yOf(last.target)); airCtx.stroke();
  }
  airCtx.strokeStyle = '#0f766e';
  airCtx.lineWidth = 2.2;
  airCtx.beginPath();
  recent.forEach((s,i) => {
    const x = xOf(i), y = yOf(s.p);
    if(i===0) airCtx.moveTo(x,y); else airCtx.lineTo(x,y);
  });
  airCtx.stroke();
  airCtx.strokeStyle = 'rgba(17,17,17,0.32)';
  airCtx.lineWidth = 1;
  airCtx.beginPath();
  recent.forEach((s,i) => {
    const x = xOf(i), y = yOf(s.raw);
    if(i===0) airCtx.moveTo(x,y); else airCtx.lineTo(x,y);
  });
  airCtx.stroke();
  airCtx.fillStyle = '#333';
  airCtx.font = '12px system-ui';
  airCtx.fillText(`${hi.toFixed(2)} kPa`, 6, 20);
  airCtx.fillText(`${lo.toFixed(2)} kPa`, 6, h-18);
}

async function refreshPorts(){
  const res = await fetch('/api/ports');
  const data = await res.json();
  const old = ports.value;
  ports.innerHTML = '';
  for(const p of data.ports || []){
    const opt = document.createElement('option');
    opt.value = p.device;
    opt.textContent = p.label;
    if(old ? p.device === old : /COM52|CH343|USB-Enhanced/i.test(p.label)) opt.selected = true;
    ports.appendChild(opt);
  }
  log(data.ports?.length ? '串口已刷新。' : '没有找到串口。上电后再点刷新。');
}

function draw(){
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,pad.width,pad.height);
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 3;
  ctx.strokeRect(36,36,pad.width-72,pad.height-72);
  const scale = (pad.width - 72) / L0;
  ctx.save();
  ctx.translate(36,36);
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#111';
  for(const stroke of strokes){
    if(stroke.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(stroke[0].x * scale, (L0 - stroke[0].y) * scale);
    for(let i=1;i<stroke.length;i++) ctx.lineTo(stroke[i].x * scale, (L0 - stroke[i].y) * scale);
    ctx.stroke();
  }
  ctx.restore();
}

function canvasPoint(e){
  const rect = pad.getBoundingClientRect();
  const padBorderPx = 36 * rect.width / pad.width;
  const scale = L0 / (rect.width - padBorderPx * 2);
  const x = Math.max(0, Math.min(L0, (e.clientX - rect.left - padBorderPx) * scale));
  const y = Math.max(0, Math.min(L0, L0 - (e.clientY - rect.top - padBorderPx) * scale));
  return {x, y};
}

function addPoint(p){
  const last = activeStroke?.[activeStroke.length - 1];
  if(!last || Math.hypot(p.x - last.x, p.y - last.y) >= 0.45){
    activeStroke.push({x:+p.x.toFixed(2), y:+p.y.toFixed(2)});
    draw();
  }
}

pad.addEventListener('pointerdown', e => {
  drawing = true;
  activeStroke = [];
  strokes.push(activeStroke);
  pad.setPointerCapture(e.pointerId);
  addPoint(canvasPoint(e));
});
pad.addEventListener('pointermove', e => { if(drawing) addPoint(canvasPoint(e)); });
pad.addEventListener('pointerup', e => {
  drawing = false;
  if(activeStroke && activeStroke.length < 2) strokes.pop();
  activeStroke = null;
  draw();
});

function parsePoint(p){
  if(Array.isArray(p)) return {x:+p[0], y:+p[1]};
  return {x:+p.x, y:+p.y};
}

function validPoint(p){
  return Number.isFinite(p.x) && Number.isFinite(p.y);
}

function parseTrajectory(text){
  const trimmed = text.trim();
  if(!trimmed) return [];
  if(trimmed[0] === '['){
    return JSON.parse(trimmed).map(stroke => stroke.map(parsePoint).filter(validPoint)).filter(s => s.length >= 2);
  }
  return trimmed.split(/\r?\n/).map(line => line.trim()).filter(Boolean).map(line =>
    line.split(';').map(pair => {
      const [x,y] = pair.split(',').map(Number);
      return {x,y};
    }).filter(validPoint)
  ).filter(s => s.length >= 2);
}

document.getElementById('file').addEventListener('change', async e => {
  const file = e.target.files?.[0];
  if(!file) return;
  strokes = parseTrajectory(await file.text());
  draw();
  log(`已载入 ${strokes.length} 段，${strokes.reduce((a,s)=>a+s.length,0)} 点。`);
});

document.getElementById('upload').onclick = async () => {
  if(!strokes.length){log('画板没有轨迹。');return;}
  const points = strokes.reduce((a,s)=>a+s.length,0);
  log(`正在上传 ${strokes.length} 段，${points} 点...`);
  uploadActive = true;
  try{
    const t0 = performance.now();
    const msg = await api('/api/upload', {port:selectedPort(), strokes});
    const dt = ((performance.now()-t0)/1000).toFixed(1);
    log(`${msg}\n上传耗时 ${dt}s`);
  }catch(e){
    log('上传失败：' + e.message);
  }finally{
    uploadActive = false;
  }
};

document.getElementById('start').onclick = async () => {
  try{
    const msg = await command('webstart', ['Web playback','No playable','USBSTATUS'], 4);
    log(msg);
    playbackActive = msg.includes('Web playback');
  }catch(e){log('开始失败：' + e.message);}
};
document.getElementById('stop').onclick = async () => {
  try{
    log(await command('webstop', ['Web playback stopped','USBSTATUS'], 3));
    playbackActive = false;
  }catch(e){log('停止失败：' + e.message);}
};
document.getElementById('clear').onclick = () => {
  strokes = [];
  activeStroke = null;
  drawing = false;
  draw();
  log('本地画板已清空。');
};
document.getElementById('calibrate').onclick = async () => {
  try{log(await command('calibrate', ['USBSTATUS'], 3));}
  catch(e){log('校准命令失败：' + e.message);}
};
document.getElementById('readStatus').onclick = async () => {
  try{
    const msg = await command('usbstatus', ['USBSTATUS'], 3);
    updateTelemetry(msg);
    log(msg);
  }catch(e){log('读取失败：' + e.message);}
};
document.getElementById('refreshPorts').onclick = refreshPorts;
manualPwm.oninput = () => {
  manualPwmText.textContent = manualPwm.value;
};

async function manualAir(commandText){
  try{
    const msg = await command(commandText, ['AIRBITS','AIRSTATUS','AIRPWM'], 4);
    updateTelemetry(msg);
    log(msg);
  }catch(e){
    log('手动调气失败：' + e.message);
  }
}

document.getElementById('manualInflate').onclick = () => {
  manualAir(`airpwm ${manualPwm.value} 0`);
};
document.getElementById('manualDeflateSlow').onclick = () => {
  manualAir('airbits 1 0 0');
};
document.getElementById('manualDeflateFast').onclick = () => {
  manualAir('airbits 3 0 0');
};
document.getElementById('manualStop').onclick = () => {
  manualAir('airbits 0 0 0');
};

let speedTimer = 0;
drawSpeed.oninput = () => {
  drawSpeedText.textContent = drawSpeed.value;
  clearTimeout(speedTimer);
  speedTimer = setTimeout(async () => {
    try{
      const msg = await command(`speed ${drawSpeed.value}`, ['USBSTATUS'], 2.5);
      appendLog(msg);
    }catch(e){appendLog('速度设置失败：' + e.message);}
  }, 160);
};

let currentTimer = 0;
motionCurrent.oninput = () => {
  motionCurrentText.textContent = `${motionCurrent.value}mA`;
  clearTimeout(currentTimer);
  currentTimer = setTimeout(async () => {
    try{
      const msg = await command(`current ${motionCurrent.value}`, ['USBSTATUS'], 2.5);
      appendLog(msg);
    }catch(e){appendLog('电机电流设置失败：' + e.message);}
  }, 160);
};

async function pollAir(){
  if(polling || uploadActive || !selectedPort()) return;
  polling = true;
  try{
    const msg = await command('airstatus', ['AIRSTATUS'], 1.8);
    updateTelemetry(msg);
  }catch(e){
    if(performance.now() - lastSampleAt > 3000) sampleRateEl.textContent = '--';
  }
  polling = false;
}

async function pollStatusSlow(){
  if(uploadActive || !selectedPort()) return;
  try{
    const msg = await command('usbstatus', ['USBSTATUS'], 2.5);
    const speed = numValue(msg, 'speed');
    if(Number.isFinite(speed)){
      drawSpeed.value = speed;
      drawSpeedText.textContent = speed;
    }
    const current = numValue(msg, 'motionCurrent');
    if(Number.isFinite(current)){
      motionCurrent.value = current;
      motionCurrentText.textContent = `${current}mA`;
    }
    updateTelemetry(msg);
  }catch(e){}
}

draw();
drawAirChart();
refreshPorts();
setInterval(pollAir, airPollMs);
setInterval(drawAirChart, 10);
setInterval(refreshPorts, 3500);
setInterval(pollStatusSlow, 5000);
</script>
</body>
</html>
